name: nexmile_rider
description: "Nexmile Rider - deliver with Nexmile."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization / formatting
  intl: any

  # Nexmile REST API
  http: ^1.2.2

  # MediaType for multipart KYC uploads. Already in the tree via `http`, but
  # imported directly here, so it is declared directly too.
  http_parser: ^4.0.2

  # Persistence for the chosen language
  shared_preferences: ^2.3.3

  # Access and refresh tokens: Keychain on iOS, EncryptedSharedPreferences on
  # Android. Never SharedPreferences — those are readable on a rooted device.
  flutter_secure_storage: ^9.2.2

  # Lightweight state propagation for locale changes
  provider: ^6.1.2

  # KYC document capture. A rider photographs a licence or an RC book far more
  # often than they have a PDF of it on the device, so the camera is the
  # primary path and the gallery the fallback.
  image_picker: ^1.1.2

  # ...but the API also accepts a PDF, which image_picker cannot return. Used
  # for the "choose a file" path only.
  file_picker: ^8.1.2

  # Dispatch ranks the board by distance and the customer watches the rider on
  # a map, so a position is needed while the app is in use. Foreground only —
  # the heartbeat runs while the rider has the app open, which is what a shift
  # looks like, and asking for background location would mean a Play Store
  # review for a capability this app does not use.
  geolocator: ^14.0.2
  # Ringing the restaurant or the customer, and handing an address off to
  # whichever maps app the device has. Both need <queries> on Android and
  # LSApplicationQueriesSchemes on iOS — see README > Permissions.
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icon/

# ---------------------------------------------------------------------------
# App launcher icons  ->  dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/icon/nexmile_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/nexmile_icon_fg.png"
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#000000"

# ---------------------------------------------------------------------------
# Native (OS-level) splash shown before the Flutter splash  ->
#   dart run flutter_native_splash:create
#
# Intentionally a plain black field with no artwork: the in-app splash opens
# from a single orange dot on black, so anything drawn here would have to
# disappear before that first beat. Black hands straight over to it.
# (Android 12+ always composites the launcher icon over the system splash —
# that is an OS behaviour, not a setting; the icon is on black too, so it
# still reads as one continuous screen.)
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"
    icon_background_color: "#000000"
  android: true
  ios: true
  web: false
  fullscreen: false
